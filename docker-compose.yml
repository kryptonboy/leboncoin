services:
    app:
        build:
            context: .
            target: dev
        volumes:
            - .:/app
        env_file:
            - .env
        expose:
            - "9000"
        depends_on:
            -   redis

    app-prod:
        build:
            context: .
            target: runtime
        environment:
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        depends_on:
            - redis

    nginx:
        image: nginx:alpine
        ports:
            - "8000:80"
        volumes:
            - ./public:/app/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            -   app

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
