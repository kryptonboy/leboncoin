name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    tests:
        runs-on: ubuntu-latest

        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build Docker image
              run: docker build -t fizzbuzz .

            - name: Run unit tests
              run: docker run --rm fizzbuzz vendor/bin/phpunit --testsuite=unit

            - name: Run functional tests
              run: docker run --rm --network host -e REDIS_HOST=localhost -e REDIS_PORT=6379 fizzbuzz vendor/bin/phpunit --testsuite=functional

            - name: Run PHPStan
              run: docker run --rm fizzbuzz sh -c "php bin/console cache:warmup --env=dev && vendor/bin/phpstan analyse --no-progress"

            - name: Run php-cs-fixer
              run: docker run --rm fizzbuzz vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction
