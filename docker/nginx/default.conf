# See https://symfony.com/doc/current/setup/web_server_configuration.html#nginx

server {
    listen 80;
    server_name localhost;
    root /app/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        # Uncomment next line and comment previous to test the runtime build docker image
        # fastcgi_pass app-prod:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/fizzbuzz_error.log;
    access_log /var/log/nginx/fizzbuzz_access.log;
}
